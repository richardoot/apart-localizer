packages:
  - 'apps/*'
  - 'packages/*'
  - 'scripts'

# pnpm 11+ reads only auth and registry settings from .npmrc; everything else
# lives here.
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
# Versions are pinned exactly: the lockfile and package.json say the same thing.
saveExact: true
engineStrict: true

# pnpm only runs a dependency's install scripts once it is listed here. The
# ones set to true are those the build relies on; telemetry stays off.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  esbuild: true
  '@scarf/scarf': false
  core-js: false
  # vue-demi ships its Vue 3 build by default; the script only matters for Vue 2.
  vue-demi: false
minimumReleaseAgeExclude:
  - '@tailwindcss/node@4.3.4'
  - '@tailwindcss/oxide-android-arm64@4.3.4'
  - '@tailwindcss/oxide-darwin-arm64@4.3.4'
  - '@tailwindcss/oxide-darwin-x64@4.3.4'
  - '@tailwindcss/oxide-freebsd-x64@4.3.4'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.4'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.4'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.4'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.4'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.4'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.4'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.4'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.4'
  - '@tailwindcss/oxide@4.3.4'
  - '@tailwindcss/vite@4.3.4'
  - '@tanstack/query-core@5.105.3'
  - '@tanstack/vue-query@5.105.3'
  - '@vitest/coverage-v8@5.1.0'
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - tailwindcss@4.3.4
  - vitest@5.1.0
