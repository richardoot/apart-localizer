<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="Suivi d'annonces d'achat d'appartement : comparateur, carte, rentabilité et prix cible."
    />
    <meta
      name="theme-color"

      rel="stylesheet"

    <title>apart-localizer</title>
    <!-- Applies the saved theme before first paint. External file: the CSP's

    <script src="/theme-init.js"></script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
