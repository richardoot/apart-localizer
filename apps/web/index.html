<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Lot 26 : l'icône de l'écran d'accueil de l'iPhone (180 × 180, opaque :
         iOS arrondit les coins lui-même) ; elle passe avant les icônes du manifeste. -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Apart" />
    <!-- Barre d'état opaque dans l'application installée : l'en-tête collé
         (top: 0) ne passe jamais dessous. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Suivi d'annonces d'achat d'appartement : comparateur, carte, rentabilité et prix cible."
    />
    <meta
      name="theme-color"
      content="#0e6b63"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1514"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>apart-localizer</title>
    <!-- Applies the saved theme before first paint. External file: the CSP's
         script-src 'self' forbids inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
